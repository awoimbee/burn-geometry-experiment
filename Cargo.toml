[package]
name = "burn-mnist"
version = "0.1.1"
edition = "2024"
description = "train a simple neural network on mnist dataset using burn."
license = "MIT"

[profile.dev.package."*"]
opt-level = 2

[dependencies]
burn = {version = "0.21.0", features = ["train", "ndarray", "metal"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4.27"
nalgebra = "0.35.0"
ndarray = "0.17.0"
rand = "0.10.2"
serde_json = "1.0"
stl_io = "0.11.0"
vtk = { path = "../rvtk/vtk" }
# vtk-rs = "0.3.0"
